	#zone {
		position: absolute;
		width: 290px;
		height: 290px;
		top: 0px;
		left: 0px;
		transition: top 0.3s ease, left 0.3s ease;
	}

	.bouton {
		position: relative;
		margin-top: 320px;
		padding: 8px 16px;
		font-size: 15px;
		cursor: pointer;
	}

	.emplacement {
		position: absolute;
		width: 130px;
		height: 130px;
		border: 2px dashed #aaa;
		box-sizing: border-box;
		transition: border-color 0.15s;
	}

	.draggable {
		position: absolute;
		width: 130px;
		height: 130px;
		cursor: grab;
	}

	#texte {

	#debug {

		top: 500px;
		left: 500px;

	#gauche img,
	#droite img {

	.rond {
	width: 20px;
	height: 20px;
	border-radius: 50%;
