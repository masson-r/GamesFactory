<!-- ======================= ACCUEIL (calque : la partie est deja mise en page dessous) ======================= -->
<section class="accueil" id="accueil" aria-labelledby="h-accueil">

    </div>
    <div class="steps" id="steps"></div>
    <p class="foot" data-i="pageTest">Page de test.</p>

</section>
